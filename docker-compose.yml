services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: intellidoc-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intellidoc-frontend
    env_file:
      - ./frontend/.env
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped